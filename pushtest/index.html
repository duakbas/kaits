<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
  <title>Push Test</title>
  <style>
    body { background: #111; color: #eee; font: 12px sans-serif; margin: 0; padding: 6px; }
    h1 { font-size: 13px; margin: 0 0 6px; color: #25d366; }
    #log { white-space: pre-wrap; word-break: break-all; font-size: 11px; line-height: 1.35; }
    /* The verdict has to be readable across a room, because it is the answer.
       The endpoint below it is 200 characters on a 240-pixel screen. */
    #server { font-size: 12px; line-height: 1.3; margin: 0 0 6px; }
    #server .name { font-weight: bold; }
    .ok { color: #25d366; }
    .bad { color: #e05252; }
    .warn { color: #e0b252; }
    .hint { color: #888; margin-top: 8px; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Push Test</h1>
  <div id="server"></div>
  <div id="log"></div>
  <div class="hint">1 = re-subscribe &nbsp; 2 = local notification</div>

<script>
// The catcher on your computer. The phone can't show you a 200-character
// endpoint URL in a way you'd ever retype, so it posts it instead.
//
// Left as a placeholder on purpose: package.sh substitutes the real address at
// build time, so there's nothing to remember to edit. Only change this by hand
// if you're serving the hosted layout straight from the repo.
var CATCHER = "";

var logEl = document.getElementById("log");
function log(msg, cls) {
  var d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = msg;
  logEl.appendChild(d);
}

function fail(where, e) {
  log("✗ " + where + ": " + (e && e.message ? e.message : e), "bad");
}

// ---- which push service did we actually get? ----
//
// KaiOS's own push server accepts pushes and throws them away, so a
// subscription against it looks perfectly healthy and never delivers anything.
// The reported workaround is to point dom.push.serverURL at Mozilla's service
// in Device Preferences. Whether that took is decided entirely by the HOST of
// the endpoint we get back — and that host is buried a fifth of the way into a
// 200-character URL on a 240-pixel screen, which is no use to anybody. So it
// gets read out here, in words.
var serverEl = document.getElementById("server");

function hostOf(ep) {
  var m = /^https?:\/\/([^\/]+)/i.exec(ep || "");
  return m ? m[1] : "";
}

function showServer(ep, cached) {
  var host = hostOf(ep);
  serverEl.innerHTML = "";
  if (!host) return;

  var line = document.createElement("div");
  line.className = "name";
  line.textContent = host;
  serverEl.appendChild(line);

  var note = document.createElement("div");
  if (host.indexOf("mozilla") >= 0) {
    note.className = "ok";
    note.textContent = "✓ Mozilla push — the pref took. Pushes should arrive.";
  } else if (host.indexOf("kaiostech") >= 0) {
    note.className = "bad";
    note.textContent = "✗ KaiOS push — accepted and discarded. Set " +
      "dom.push.serverURL to wss://push.services.mozilla.com/ then press 1.";
  } else {
    note.className = "warn";
    note.textContent = "? unrecognised push service";
  }
  serverEl.appendChild(note);

  // The trap this test exists to avoid falling into: getSubscription() hands
  // back the subscription made BEFORE the pref changed, against the old
  // server, and nothing about it looks stale. Changing the pref and reopening
  // the app is not enough — the old subscription has to be thrown away.
  if (cached) {
    var c = document.createElement("div");
    c.className = "warn";
    c.textContent = "(reused an existing subscription — press 1 to force a " +
      "new one after changing the pref)";
    serverEl.appendChild(c);
  }
}

if (!("serviceWorker" in navigator)) {
  log("✗ no serviceWorker in this browser", "bad");
} else if (!("PushManager" in window)) {
  log("✗ no PushManager in this browser", "bad");
} else {
  start();
}

function start() {
  log("registering worker…");
  navigator.serviceWorker.register("sw.js")
    .then(function (reg) {
      log("✓ worker registered", "ok");
      return askPermission().then(function () { return subscribe(reg); });
    })
    .catch(function (e) { fail("register", e); });
}

function askPermission() {
  if (!window.Notification) { log("✗ no Notification API", "bad"); return Promise.resolve(); }
  if (Notification.permission === "granted") { log("✓ notifications allowed", "ok"); return Promise.resolve(); }
  return Notification.requestPermission().then(function (p) {
    log(p === "granted" ? "✓ notifications allowed" : "✗ notifications denied: " + p,
        p === "granted" ? "ok" : "bad");
  });
}

// Subscribe with NO applicationServerKey. KaiOS permits this; the trade-off is
// that pushes must then be payload-free, which is exactly what the real app
// does — the push is a doorbell, the content is fetched separately.
function subscribe(reg) {
  var wasCached = false;
  return reg.pushManager.getSubscription()
    .then(function (existing) {
      if (existing) { wasCached = true; return existing; }
      return reg.pushManager.subscribe({ userVisibleOnly: true });
    })
    .then(function (sub) {
      var ep = sub && sub.endpoint;
      if (!ep) { log("✗ subscribed but no endpoint", "bad"); return; }
      log(wasCached ? "✓ existing subscription" : "✓ subscribed", "ok");
      showServer(ep, wasCached);
      log(ep);
      return sendToCatcher(ep);
    })
    .catch(function (e) {
      fail("subscribe", e);
      log("If this is the failure, the answer is: keyless subscribe is not " +
          "allowed here, and the app needs a VAPID key after all.");
    });
}

function sendToCatcher(ep) {
  if (!CATCHER) {
    log("(no catcher address baked in — the endpoint is above, transcribe it)");
    return;
  }
  return fetch(CATCHER + "/endpoint", { method: "POST", body: ep })
    .then(function () { log("✓ endpoint sent to " + CATCHER, "ok"); })
    .catch(function (e) { fail("sending endpoint", e); });
}

// The worker reports each push it receives, so pushes that arrive while the app
// happens to be open are visible here too.
var pushCount = 0;
navigator.serviceWorker.addEventListener("message", function (ev) {
  if (ev.data && ev.data.type === "push") {
    pushCount++;
    log("✓ PUSH RECEIVED #" + pushCount + " at " + new Date().toLocaleTimeString(), "ok");
  }
});

// ---- heartbeat: how long does this app keep running once you close the phone? ----
//
// With KaiOS's push service dropping everything, the fallback is for the app to
// hold its own connection and raise notifications itself. That only works while
// the app is alive, and nobody seems to know how long that is on a flip phone
// with the lid shut. So: post a beat every 15s and watch when they stop.
//
// The beats also say whether the page is hidden, because "still running while
// backgrounded" and "still running while visible" are different answers.
var beat = 0;
var startedAt = Date.now();

function sendBeat() {
  if (!CATCHER) return;
  beat++;
  var alive = Math.round((Date.now() - startedAt) / 1000);
  var hidden = (typeof document.hidden === "boolean") ? document.hidden : "unknown";
  fetch(CATCHER + "/beat", {
    method: "POST",
    body: JSON.stringify({ beat: beat, aliveSeconds: alive, hidden: hidden })
  }).catch(function () { /* catcher down, or we're offline; keep beating */ });
}
setInterval(sendBeat, 15000);
sendBeat();

document.addEventListener("keydown", function (e) {
  if (e.key === "1") {
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) return;
      reg.pushManager.getSubscription().then(function (s) {
        if (s) s.unsubscribe().then(function () { subscribe(reg); });
        else subscribe(reg);
      });
    });
  } else if (e.key === "2") {
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (reg) reg.showNotification("Push Test", { body: "Local notification, no push involved" });
    });
  }
});
</script>
</body>
</html>
