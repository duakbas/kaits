<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
  <title>Kaits</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header>
      <span>Kaits</span>
      <span id="status" class="status closed">○</span>
    </header>

    <!-- In-app notification bar. Overlays the top of whatever screen is up
         rather than sitting in the flex column, so showing it never reflows
         the thread underneath. -->
    <div id="notif-bar" hidden>
      <div id="notif-title"></div>
      <div id="notif-body"></div>
    </div>

    <!-- First-run setup: where the daemon is. Shown instead of the chat list
         until it's been answered, and reachable later from the list. -->
    <div id="setup" class="screen" tabindex="-1" hidden>
      <div class="setup-head">Connect to your daemon</div>
      <div class="setup-label">Server address</div>
      <input id="setup-host" type="text" placeholder="192.168.1.200">
      <div class="setup-label">Token</div>
      <input id="setup-token" type="text" placeholder="WAD_TOKEN">
      <div class="setup-preview" id="setup-preview"></div>
      <div class="setup-hint">
        Your computer's address on this network, and the token you started
        wad with. Port 8080 is assumed if you don't give one.
      </div>
      <!-- There is no console on the phone, so anything worth knowing has to be
           on screen. This is the only way to tell a denied permission from a
           dead socket from a worker that never registered. -->
      <div class="setup-diag" id="setup-diag"></div>
    </div>

    <!-- chat list -->
    <div id="chatlist" class="screen" tabindex="-1"></div>

    <!-- thread -->
    <div id="thread" class="screen" tabindex="-1" hidden>
      <!-- Avatar, name, and a second line for typing/presence — the same shape
           the official client uses, and the presence line is information we
           already receive but previously crammed into the name with a dash. -->
      <div id="thread-title">
        <div id="thread-avatar" class="avatar"></div>
        <div id="thread-head-text">
          <div id="thread-name"></div>
          <div id="thread-sub"></div>
        </div>
      </div>
      <div id="thread-msgs"></div>
      <!-- Shown only while a live location share is running in this chat. A
           share with nothing on screen to say so is a battery drain the user
           can't see. -->
      <div id="live-bar" hidden></div>
      <div id="reply-bar" hidden>
        <div id="reply-bar-text"></div>
        <span id="reply-bar-x">✕</span>
      </div>
      <!-- The paperclip is a visible home for attachments. There's no touch on
           KaiOS, so it doubles as a hint that Left opens the attach menu; it is
           still clickable, which is what makes it usable in a desktop browser. -->
      <div id="composer-row">
        <span id="attach-btn" title="Attach (press Left)">📎</span>
        <input id="composer" type="text" placeholder="Type a message…">
      </div>
    </div>

    <!-- contact / group info -->
    <div id="profile" class="screen" tabindex="-1" hidden>
      <div id="profile-body"></div>
    </div>

    <!-- message action menu overlay. Rows are rebuilt per message, because
         which actions apply depends on the message (own vs someone else's,
         group vs DM), so this starts empty. -->
    <div id="action-menu" hidden>
      <div class="menu-box" id="action-box"><div id="action-list"></div></div>
    </div>

    <!-- chat action menu (Right key on a chat row) -->
    <div id="chat-menu" hidden>
      <div class="menu-box">
        <div class="fwd-title" id="chat-menu-title"></div>
        <div id="chat-menu-list"></div>
      </div>
    </div>

    <!-- full-screen media viewer -->
    <div id="viewer" hidden>
      <img id="viewer-img" alt="">
      <div id="viewer-caption"></div>
    </div>

    <!-- search -->
    <div id="search" class="screen" tabindex="-1" hidden>
      <input id="search-input" type="text" placeholder="Search messages…">
      <div id="search-results"></div>
    </div>

    <!-- single-line text prompt, used for naming a contact -->
    <div id="prompt" hidden>
      <div class="menu-box">
        <div class="fwd-title" id="prompt-title"></div>
        <input id="prompt-input" type="text">
        <div class="prompt-hint" id="prompt-hint"></div>
      </div>
    </div>

    <!-- incoming call -->
    <div id="call" class="screen" tabindex="-1" hidden>
      <div class="label">Incoming call</div>
      <div class="ring">📞</div>
      <div id="call-name"></div>
    </div>

    <!-- forward destination picker -->
    <div id="fwd-picker" hidden>
      <div class="menu-box">
        <div class="fwd-title">Forward to…</div>
        <div id="fwd-list"></div>
      </div>
    </div>

    <!-- Key log, shown only when CONFIG.DEBUG_KEYS is on. There is no console
         on the phone and no way to attach one, so when the keypad appears dead
         this is the difference between a diagnosis and a guess. -->
    <div id="keylog" hidden></div>

    <!-- Somewhere for focus to go that isn't a text field. blur() alone leaves
         KaiOS's input method attached, which swallows the D-pad: the keypad
         keeps feeding a textbox that isn't on screen any more. -->
    <div id="focus-sink" tabindex="-1"></div>

    <!-- softkey bar -->
    <div id="softkeys">
      <span id="sk-left"></span>
      <span id="sk-center"></span>
      <span id="sk-right"></span>
    </div>
  </div>

  <!-- load order matters: config -> wire -> nav -> app -->
  <script src="js/config.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/wire.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script src="js/push.js"></script>
</body>
</html>
